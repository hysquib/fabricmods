<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fabric 模组同步站</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f5ed;color:#223b30;font:17px/1.65 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:12vh 24px}header{border-top:6px solid #477158}h1{font-size:clamp(32px,7vw,60px);line-height:1.15}a{display:inline-block;padding:12px 22px;background:#26563b;color:white;border-radius:8px;text-decoration:none}section{margin-top:52px;border-top:1px solid #b8c6b6}li{overflow-wrap:anywhere}</style>
<main><header><p>Minecraft · Fabric 1.21.1</p><h1>模组同步站</h1><p>关闭游戏，完整解压同步器，双击 ModSync.exe，选择 PCL 实例的 mods 文件夹。核对列表后确认更新。</p><a href="FabricModSync.zip" download>下载 Windows 同步器 ↓</a></header><section><h2>本次发布的模组</h2><p id="state">正在读取清单…</p><ul id="mods"></ul></section></main>
<script>fetch('mods/manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>{document.querySelector('#state').textContent=m.mods.length?'共 '+m.mods.length+' 个模组':'服主尚未发布模组。';for(const x of m.mods){const li=document.createElement('li');li.textContent=x.name;document.querySelector('#mods').append(li)}}).catch(()=>document.querySelector('#state').textContent='清单暂时无法读取，请稍后刷新。')</script></html>
